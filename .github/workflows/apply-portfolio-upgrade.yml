name: Apply portfolio upgrade bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-portfolio-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Validate and apply the website snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Safely extract the supplied website snapshot
        shell: bash
        env:
          ARCHIVE: landon-carter-windvogel-upgraded.zip
          EXTRACT_DIR: ${{ runner.temp }}/portfolio-site
        run: |
          set -euo pipefail
          test -f "$ARCHIVE" || { echo "Upload $ARCHIVE to the repository root first." >&2; exit 1; }
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          python3 - "$ARCHIVE" "$EXTRACT_DIR" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys, zipfile

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2]).resolve()
          prefix = "landon-carter-windvogel-main/"
          with zipfile.ZipFile(archive) as bundle:
              members = [item for item in bundle.infolist() if not item.is_dir()]
              if not members:
                  raise SystemExit("The uploaded ZIP is empty.")
              for item in members:
                  if not item.filename.startswith(prefix):
                      raise SystemExit(f"Unexpected ZIP root entry: {item.filename}")
                  relative = PurePosixPath(item.filename[len(prefix):])
                  if not relative.parts or relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  target = (output / Path(*relative.parts)).resolve()
                  if not target.is_relative_to(output):
                      raise SystemExit(f"Unsafe archive destination: {item.filename}")
                  if item.file_size > 25_000_000:
                      raise SystemExit(f"Unexpectedly large file: {item.filename}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.open(item) as source, target.open("wb") as destination:
                      destination.write(source.read())
          required = ["index.html", "404.html", "netlify.toml", "scripts/validate_site.py"]
          missing = [name for name in required if not (output / name).is_file()]
          if missing:
              raise SystemExit("Missing required site files: " + ", ".join(missing))
          print(f"Extracted {len(members)} files into {output}")
          PY
          echo "EXTRACT_DIR=$EXTRACT_DIR" >> "$GITHUB_ENV"

      - name: Validate the extracted website before changing the repository
        shell: bash
        run: |
          set -euo pipefail
          node --check "$EXTRACT_DIR/assets/js/main.js"
          node --check "$EXTRACT_DIR/assets/js/hero-gl.js"
          python3 "$EXTRACT_DIR/scripts/validate_site.py"

      - name: Replace the repository root with the validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          # Preserve workflows while the Actions token updates the site files.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          while IFS= read -r -d '' entry; do
            name="${entry##*/}"
            [[ "$name" == ".github" ]] && continue
            cp -a "$entry" .
          done < <(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -print0)
          rm -f "landon-carter-windvogel-upgraded.zip"
          git add --all
          if git diff --cached --quiet; then
            echo "The repository already matches the supplied snapshot."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Upgrade portfolio: unified pages and hardened performance"
            git push origin main
          fi

      - name: Remove all other branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')"
          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == "main" ]] && continue
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            echo "Removing obsolete branch: $branch"
            gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done <<< "$branches"
          echo "Branch cleanup completed; main is the only intended branch."
